<mat-sidenav-container class="sidenav-container" [ngClass]="{'entertainment-page': isEntertainmentPage}">
  <!-- Side nav -->
  <mat-sidenav #sidenav class="body" mode="side">
    <mat-nav-list>
      <a mat-list-item class="content" routerLink="/" routerLinkActive="active">
        <mat-icon class="icon">home</mat-icon> Home
      </a>
      <br/>
      <a mat-list-item class="content" routerLink="/computer-science" routerLinkActive="active">
        <mat-icon class="icon">laptop</mat-icon> Computer Science
      </a>
      <br/>
      <a mat-list-item class="content" routerLink="/entertainment" routerLinkActive="active">
        <mat-icon class="icon">movies</mat-icon> Entertainment
      </a>
      <br/>
      <a mat-list-item class="content" routerLink="/nonprofit" routerLinkActive="active">
        <mat-icon class="icon">volunteer_activism</mat-icon> Nonprofit
      </a>
      <br/>
      <a mat-list-item class="content" routerLink="/entrepreneurship" routerLinkActive="active">
        <mat-icon class="icon">emoji_events</mat-icon> Entrepreneurship
      </a>
      <br/>
      <a mat-list-item class="content" routerLink="/cybersecurity" routerLinkActive="active">
        <mat-icon class="icon">security</mat-icon> Cybersecurity
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main content area -->
  <mat-sidenav-content>
    <!-- Toggle button for sidenav -->
    <div class="logo-container">
      
        <mat-icon class="raised" mat-icon-button (click)="toggleSidenav()" [ngClass]="{'entertainment-menu-button': isEntertainmentPage}">menu</mat-icon>
      
      <mat-toolbar [ngClass]="{'entertainment-toolbar': isEntertainmentPage, 'default-toolbar': !isEntertainmentPage}">
        <span class="page-title"> <b>{{ pageTitle }} </b></span>
        <img *ngIf="isComputerSciencePage" src="assets/Logo.jpg" alt="McNair Hall" class="toolbar-icon">
      </mat-toolbar>
    </div>

    <!-- Add other page content here as needed -->
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
