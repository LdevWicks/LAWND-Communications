<h2 mat-dialog-title>{{ movie.title }}</h2>
<mat-dialog-content>
  <p>{{ movie.description }}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onClose()">Close</button>
  <a mat-button color="primary" href="{{ movie.imdbLink }}" target="_blank">Watch on IMDb</a>
</mat-dialog-actions>
